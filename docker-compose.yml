services:
  app:
    build: .
    container_name: llm-platform-app
    ports:
      - "8000:8000"
    environment:
      # Ollama runs natively on the Mac host, not in a container, so the app
      # reaches it through Docker's special host alias.
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      DEFAULT_MODEL: llama3.2:3b
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_MODEL: all-minilm
      RAG_MIN_SCORE: "0.25"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: llm-platform-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: llm-platform-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  loadgen:
    build: ./loadgen
    container_name: llm-platform-loadgen
    environment:
      TARGET_URL: http://app:8000/generate
      REQUEST_INTERVAL_SECONDS: "20"
    depends_on:
      - app
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: llm-platform-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant-data:
  prometheus-data:
  grafana-data:
